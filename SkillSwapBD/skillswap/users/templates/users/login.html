<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SkillSwap BD</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            linear-gradient(135deg,#0f172a,#111827,#1e293b);
            overflow:hidden;
        }


        /* LOGIN BOX */

        .login-box{
            width:430px;
            padding:45px;
            background:rgba(15,23,42,0.68);
            border:1px solid rgba(255,255,255,0.08);
            backdrop-filter:blur(24px);
            border-radius:30px;
            box-shadow:
            0 10px 40px rgba(0,0,0,0.45);
            position:relative;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .login-box h1{
            text-align:center;
            margin-bottom:35px;
            font-size:58px;
            font-weight:700;
            background:linear-gradient(90deg,#ffffff,#c084fc);
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .input-box{
            margin-bottom:25px;
        }

        .input-box input{
            width:100%;
            padding:17px 20px;
            border:none;
            outline:none;
            border-radius:16px;
            background:rgba(255,255,255,0.10);
            border:1px solid rgba(255,255,255,0.06);
            color:white;
            font-size:16px;
            transition:0.3s;
        }

        .input-box input:focus{
            border:1px solid #8b5cf6;
            box-shadow:none;
        }

        .input-box input::placeholder{
            color:#e5e7eb;
        }

        .login-btn{
            width:100%;
            padding:17px;
            border:none;
            border-radius:16px;
            background:linear-gradient(90deg,#8b5cf6,#7c3aed);
            color:white;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            transform:translateY(-3px);
            opacity:0.95;
        }

        .bottom-text{
            text-align:center;
            margin-top:30px;
            font-size:15px;
            color:#d1d5db;
        }

        .bottom-text a{
            color:white;
            font-weight:600;
            text-decoration:none;
        }

        .bottom-text a:hover{
            text-decoration:underline;
        }

        .password-box{
            position:relative;
}

        .toggle-password{
            position:absolute;
            right:18px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            font-size:20px;
}

        .floating-box{
            position:relative;
            margin-bottom:30px;
}

        .floating-box input{
            width:100%;
            padding:18px;
            border:none;
            border-radius:14px;
            background:rgba(255,255,255,0.15);
            color:white;
            outline:none;
}

        .floating-box label{
            position:absolute;
            left:18px;
            top:18px;
            color:#e5e7eb;
            transition:0.3s;
            pointer-events:none;
}

        .floating-box input:focus + label,
        .floating-box input:valid + label{

            top:-10px;
            left:12px;
            font-size:13px;
            background:#2563eb;
            padding:2px 8px;
            border-radius:8px;
}

        .forgot-password{
            text-align:right;
            margin:18px 0 10px;
}

        .forgot-password a{
            color:white;
            text-decoration:none;
            font-size:14px;
}

        .forgot-password a:hover{
            text-decoration:underline;
}

        .particles{
            position:absolute;
            width:100%;
            height:100%;
            background-image:
            radial-gradient(white 1px, transparent 1px);
            background-size:40px 40px;
            opacity:0.15;
            animation:moveParticles 20s linear infinite;
}

@keyframes moveParticles{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-200px);
    }

}

        .social-login{
            display:flex;
            gap:15px;
            margin-top:25px;
}

        .social-login button{
            flex:1;
            padding:14px;
            border:none;
            border-radius:14px;
            cursor:pointer;
            font-weight:600;
            transition:0.3s;
}

        .social-login button i{
            margin-right:8px;
            font-size:16px;
}

        .social-login button:hover{
            transform:translateY(-3px);
}

        .google-btn{
            background:white;
            color:#111827;
}

        .facebook-btn{
            background:#1877f2;
            color:white;
}

.google-btn,
.facebook-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
}

@media(max-width:500px){

        .login-box,
        .register-box{

            width:90%;
            padding:30px;

    }

        .login-box h1,
        .register-box h1{

            font-size:30px;

    }

}

.toggle-password{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
    color:#cbd5e1;
    transition:0.3s;
}

.toggle-password:hover{
    color:white;
}

    </style>

</head>

<body>


    <!-- LOGIN CARD -->

    <div class="login-box">

        <h1>Login</h1>

        <form method="POST">

            {% csrf_token %}

            {% if error_message %}
        <div class="alert alert-danger text-center" role="alert">
            {{ error_message }}
        </div>
    {% endif %}


         <div class="floating-box">

    <input type="text"
           name="username"
           required>

    <label>
        Username
    </label>

</div>

            <div class="input-box password-box">

    <input type="password"
           name="password"
           placeholder="Enter Password"
           id="password"
           required>

    <span class="toggle-password"
          onclick="togglePassword()">

        <i class="fa-regular fa-eye" id="eyeIcon"></i>

    </span>

</div>

            <button type="submit"
                    class="login-btn">

                Login

            </button>

            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>

        </form>

        <div class="social-login">

            <button class="google-btn">
                    <i class="fa-brands fa-google"></i>
                    Google 
            </button>

            <button class="facebook-btn">
                    <i class="fa-brands fa-facebook-f"></i>
                    Facebook
            </button>

        </div>

        <div class="bottom-text">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register Here
            </a>

        </div>

    </div>

<script>

function togglePassword(){

    const password =
    document.getElementById("password");

    const eyeIcon =
    document.getElementById("eyeIcon");

    if(password.type === "password"){

        password.type = "text";

        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");

    }

    else{

        password.type = "password";

        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");

    }

}

</script>

</body>
</html>
