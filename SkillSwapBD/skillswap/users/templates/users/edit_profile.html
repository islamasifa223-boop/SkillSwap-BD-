<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f7fc;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .profile-card{
            width:100%;
            max-width:700px;
            background:white;
            border-radius:30px;
            padding:50px;
            box-shadow:0 15px 40px rgba(0,0,0,0.08);
        }

        .title{
            text-align:center;
            margin-bottom:40px;
        }

        .title h1{
            font-size:42px;
            color:#111827;
        }

        .profile-image{
            text-align:center;
            margin-bottom:30px;
        }

        .profile-image img{
            width:140px;
            height:140px;
            border-radius:50%;
            object-fit:cover;
            border:5px solid #2563eb;
        }

        form{
            display:flex;
            flex-direction:column;
            gap:22px;
        }

        .form-group{
            display:flex;
            flex-direction:column;
        }

        label{
            margin-bottom:10px;
            font-weight:600;
            color:#111827;
        }

        input,
        textarea{
            padding:16px;
            border:none;
            border-radius:14px;
            background:#f3f4f6;
            font-size:16px;
            outline:none;
        }

        textarea{
            resize:none;
            height:120px;
        }

        input:focus,
        textarea:focus{
            border:2px solid #2563eb;
            background:white;
        }

        .save-btn{
            margin-top:10px;
            padding:16px;
            border:none;
            border-radius:14px;
            background:#2563eb;
            color:white;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .save-btn:hover{
            background:#1d4ed8;
            transform:translateY(-3px);
        }

    </style>

</head>
<body>

    <div class="profile-card">

        <div class="title">
            <h1>👤 Edit Profile</h1>
        </div>

        <div class="profile-image">

            {% if profile.profile_image %}

                <img src="{{ profile.profile_image.url }}">

            {% endif %}

        </div>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">
                <label>Profile Image</label>
                {{ form.profile_image }}
            </div>

            <div class="form-group">
                <label>Bio</label>
                {{ form.bio }}
            </div>

            <div class="form-group">
                <label>Location</label>
                {{ form.location }}
            </div>

            <div class="form-group">
                <label>Facebook</label>
                {{ form.facebook }}
            </div>

            <div class="form-group">
                <label>LinkedIn</label>
                {{ form.linkedin }}
            </div>

            <button type="submit" class="save-btn">
                Save Profile
            </button>

        </form>

    </div>

</body>
</html>
