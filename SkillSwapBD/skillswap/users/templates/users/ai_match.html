<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skill Matches</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            text-align: center;
            margin: 30px 0;
            font-weight: 600;
            color: #333;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            font-weight: 500;
            font-size: 1.1rem;
        }
        .card-body p {
            margin-bottom: 5px;
            color: #555;
        }
        .btn-chat {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>AI Skill Matches 🤖</h1>

<div class="container">
    <div class="row justify-content-center">
        {% for match in matched_users %}
            <div class="col-md-6 col-lg-4 mb-4 d-flex">
                <div class="card h-100 shadow-sm flex-fill">
                    <div class="card-header bg-primary text-white">
                        {{ match.title }}
                    </div>
                    <div class="card-body">
                        <p><strong>Teacher:</strong> {{ match.user.username }}</p>
                        <p><strong>Category:</strong> {{ match.category }}</p>
                        <a href="/chat/{{ match.user.id }}/" class="btn btn-primary w-100 mt-2">Chat</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
