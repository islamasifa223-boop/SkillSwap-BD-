<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat 💬</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f7fc;
        }

        .chat-container{
            width:60%;
            margin:40px auto;
            background:white;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
            overflow:hidden;
        }

        .chat-header{
            background:#2563eb;
            color:white;
            padding:20px;
            font-size:24px;
            font-weight:bold;
        }

        .chat-box{
            height:400px;
            overflow-y:auto;
            padding:20px;
            background:#f9fafb;
        }

        .message{
            margin-bottom:15px;
            padding:12px 18px;
            border-radius:15px;
            width:fit-content;
            max-width:70%;
        }

        .sent{
            background:#2563eb;
            color:white;
            margin-left:auto;
        }

        .received{
            background:#e5e7eb;
            color:black;
        }

        .chat-form{
            display:flex;
            padding:20px;
            gap:10px;
            border-top:1px solid #ddd;
        }

        .chat-form input{
            flex:1;
            padding:15px;
            border:1px solid #ccc;
            border-radius:12px;
        }

        .chat-form button{
            background:#10b981;
            color:white;
            border:none;
            padding:15px 25px;
            border-radius:12px;
            cursor:pointer;
        }

        .chat-form button:hover{
            background:#059669;
        }

    </style>

</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        Chat with {{ other_user.username }} 💬
    </div>

    <div class="chat-box">

        {% for msg in messages %}

            {% if msg.sender == request.user %}

                <div class="message sent">
                    {{ msg.message }}
                </div>

            {% else %}

                <div class="message received">
                    {{ msg.message }}
                </div>

            {% endif %}

        {% endfor %}

    </div>

    <form method="POST" class="chat-form">

        {% csrf_token %}

        <input 
            type="text"
            name="message"
            placeholder="Type your message..."
            required
        >

        <button type="submit">
            Send
        </button>

    </form>

</div>

</body>
</html>
