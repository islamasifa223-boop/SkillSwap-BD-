<!DOCTYPE html>
<html>
<head>
    <title>Requests</title>
</head>

<body>

    <h1>Exchange Requests</h1>
{% for request in requests %}
<div class="request-card mb-3 p-3 rounded shadow-sm">
    <h4>{{ request.sender.username }}</h4>
    <p><strong>Skill:</strong> {{ request.skill.title }}</p>
    <p><strong>Message:</strong> {{ request.message }}</p>
    <p><strong>Status:</strong> {{ request.status }}</p>

    <div class="action-buttons mt-2">
        <a href="{% url 'accept_request' request.id %}" class="btn btn-green me-2">Accept</a>
        <a href="{% url 'reject_request' request.id %}" class="btn btn-red">Reject</a>
    </div>

    {% if request.status == 'Accepted' %}
    <div class="mt-3">
        <a href="{% url 'create_session' request.id %}" class="btn btn-purple">Create Session</a>
    </div>
    {% endif %}
</div>
{% endfor %}

</body>
</html>
